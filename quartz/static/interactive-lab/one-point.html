:root{
  --bg:#05070b; --ink:#f1ecdf; --ink-bright:#fffaf0;
  --dim:rgba(241,236,223,.46); --faint:rgba(241,236,223,.22);
  --accent:#e2b76f;
  --serif:'Cormorant',Georgia,'Times New Roman',serif;
  --sans:'SpaceGrotesk','Segoe UI',Helvetica,Arial,sans-serif;
  --mono:'PlexMono','Cascadia Mono',Consolas,monospace;
  --math:'STIXMath','Cambria Math',serif;
  --var:'STIXVar','STIXMath','Cambria Math',serif;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);}
body{position:fixed;inset:0;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;user-select:none;-webkit-user-select:none;touch-action:none;cursor:default;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
::selection{background:rgba(226,183,111,.22);}
:focus-visible{outline:1px solid var(--accent);outline-offset:5px;}

#bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(75% 72% at 61% 45%,rgba(38,67,80,.18) 0%,rgba(17,28,38,.06) 40%,transparent 72%),
    radial-gradient(60% 66% at 20% 72%,rgba(95,70,37,.08) 0%,transparent 68%),
    radial-gradient(120% 120% at 50% 48%,#090e15 0%,#050810 46%,#030509 100%);
}
#bg::before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(241,236,223,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(241,236,223,.022) 1px,transparent 1px);
  background-size:90px 90px;
  -webkit-mask-image:radial-gradient(ellipse 82% 84% at 62% 47%,#000 0%,rgba(0,0,0,.55) 48%,transparent 82%);
  mask-image:radial-gradient(ellipse 82% 84% at 62% 47%,#000 0%,rgba(0,0,0,.55) 48%,transparent 82%);
  opacity:.65;
}
#tint{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(40% 38% at 62% 45%,var(--accent),transparent 72%);opacity:.05;mix-blend-mode:screen;}
#stage{position:fixed;inset:0;z-index:2;width:100%;height:100%;pointer-events:none;filter:brightness(1.18) contrast(1.02) saturate(1.06);}
#vignette{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(125% 110% at 61% 46%,transparent 42%,rgba(2,4,8,.23) 72%,rgba(2,4,8,.68) 100%);mix-blend-mode:multiply;}
#grain{position:fixed;inset:-40%;z-index:4;pointer-events:none;opacity:.03;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.83' numOctaves='3' stitchTiles='stitch'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");mix-blend-mode:soft-light;animation:grain 1.2s steps(4) infinite;}
@keyframes grain{0%{transform:translate3d(0,0,0)}25%{transform:translate3d(-2%,1.4%,0)}50%{transform:translate3d(1.5%,-1.8%,0)}75%{transform:translate3d(-1%,-1%,0)}100%{transform:translate3d(0,0,0)}}

#ui{position:fixed;inset:0;z-index:6;pointer-events:none;}
#brand{position:absolute;top:clamp(20px,3.2vh,34px);left:clamp(24px,4.7vw,86px);display:flex;align-items:center;gap:14px;opacity:0;transform:translateY(-6px);transition:opacity 1.3s ease .15s,transform 1.3s cubic-bezier(.16,1,.3,1) .15s;}
body.ready #brand{opacity:1;transform:none;}
.brand-mark{width:37px;height:37px;border:1px solid rgba(241,236,223,.18);border-radius:50%;display:grid;place-items:center;color:var(--accent);flex:none;position:relative;}
.brand-mark::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid rgba(241,236,223,.045);}
.brand-mark svg{width:24px;height:24px;overflow:visible;}
.brand-mark circle{fill:none;stroke:currentColor;stroke-width:1.1;}
.brand-mark .core{fill:currentColor;stroke:none;opacity:.9;}
.brand-copy{display:flex;flex-direction:column;gap:4px;}
.brand-title{font:400 10.5px/1 var(--sans);letter-spacing:.34em;text-indent:.34em;color:rgba(241,236,223,.90);}
.brand-sub{font:400 7.5px/1.2 var(--mono);letter-spacing:.22em;color:rgba(241,236,223,.30);}

#topright{position:absolute;top:clamp(19px,3vh,32px);right:clamp(24px,4.7vw,86px);display:flex;align-items:center;gap:16px;opacity:0;transform:translateY(-6px);transition:opacity 1.3s ease .3s,transform 1.3s cubic-bezier(.16,1,.3,1) .3s;pointer-events:none;}
body.ready #topright{opacity:1;transform:none;}
#count{font:400 9px/1 var(--mono);letter-spacing:.22em;color:rgba(241,236,223,.4);}
#count b{font-weight:400;color:var(--accent);}
#playpause{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;pointer-events:auto;transition:transform .4s cubic-bezier(.2,.8,.2,1);}
#playpause:hover{transform:scale(1.06);}
#playpause svg{position:absolute;inset:0;width:42px;height:42px;overflow:visible;}
.progress-bg{fill:none;stroke:rgba(241,236,223,.13);stroke-width:1;}
.progress-ring{fill:none;stroke:var(--accent);stroke-width:1;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;stroke-dasharray:119.38;stroke-dashoffset:119.38;opacity:.85;}
#playpause::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(241,236,223,.12);background:rgba(5,8,13,.22);transition:background .35s ease,border-color .35s ease;}
#playpause:hover::before{background:rgba(241,236,223,.055);border-color:rgba(241,236,223,.22);}
.pause-bars{position:relative;z-index:1;display:flex;gap:3px;}
.pause-bars i{display:block;width:1.5px;height:9px;background:rgba(241,236,223,.84);border-radius:1px;}
.play-tri{position:relative;z-index:1;display:none;width:0;height:0;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;border-left:7px solid rgba(241,236,223,.88);margin-left:2px;}
body.paused .pause-bars{display:none;}
body.paused .play-tri{display:block;}

#readout{position:absolute;left:clamp(26px,5vw,96px);bottom:clamp(88px,11vh,128px);width:min(32vw,450px);opacity:0;transform:translateY(12px);transition:opacity 1.4s ease .3s,transform 1.4s cubic-bezier(.16,1,.3,1) .3s;pointer-events:none;}
body.ready #readout{opacity:1;transform:none;}
.meta{display:flex;align-items:center;gap:9px;font:400 9px/1.2 var(--mono);letter-spacing:.19em;text-transform:uppercase;color:rgba(241,236,223,.36);}
.meta .idx{color:var(--accent);}
.meta .dot{color:rgba(241,236,223,.16);}
.meta .year{text-transform:none;letter-spacing:.12em;}
#mTitle{margin:14px 0 0;font-family:var(--serif);font-size:clamp(38px,3.6vw,58px);font-weight:400;line-height:.9;letter-spacing:-.02em;color:var(--ink-bright);white-space:nowrap;}
#mFormula{font-family:var(--math);font-size:clamp(26px,2.7vw,46px);line-height:1.25;color:var(--ink-bright);white-space:nowrap;margin-top:18px;text-shadow:0 0 38px rgba(241,236,223,.08);}
#mFormula i{font-family:var(--var);font-style:italic;}
#mFormula sup,#mFormula sub{font-size:.55em;line-height:0;position:relative;font-family:var(--math);}
#mFormula sup{top:-.58em;}#mFormula sub{bottom:-.2em;}
#mFormula .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:-.52em;font-size:.78em;line-height:.98;margin:0 .1em;}
#mFormula .frac .num{padding:0 .1em .05em;border-bottom:1px solid rgba(241,236,223,.55);}
#mFormula .frac .den{padding:.05em .1em 0;}
#mFormula .sum{font-size:1.1em;line-height:0;}
#mFormula .odd{font-family:var(--mono);font-size:.27em;letter-spacing:.12em;text-transform:uppercase;vertical-align:.2em;margin-left:.35em;color:rgba(241,236,223,.42);}
#mFormula .int{font-size:1.15em;}
#mCaption{margin:16px 0 0;max-width:34ch;font-family:var(--serif);font-style:italic;font-size:clamp(14px,1.3vw,17px);line-height:1.4;color:rgba(241,236,223,.42);}
#mNote{margin:11px 0 0;font:400 7.5px/1.5 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:rgba(241,236,223,.27);}
#readout.swap .meta,#readout.swap #mTitle,#readout.swap #mFormula,#readout.swap #mCaption,#readout.swap #mNote{animation:riseIn .24s cubic-bezier(.16,1,.3,1) both;}
#readout.swap .meta{animation-delay:.005s}#readout.swap #mTitle{animation-delay:.015s}#readout.swap #mFormula{animation-delay:.03s}#readout.swap #mCaption{animation-delay:.045s}#readout.swap #mNote{animation-delay:.06s}
@keyframes riseIn{0%{opacity:0;transform:translateY(11px);filter:blur(4px);}100%{opacity:1;transform:none;filter:blur(0);}}

#timeline{position:absolute;left:clamp(26px,4.7vw,86px);right:clamp(26px,4.7vw,86px);bottom:clamp(25px,4vh,40px);height:36px;opacity:0;transform:translateY(8px);transition:opacity 1.5s ease .5s,transform 1.5s cubic-bezier(.16,1,.3,1) .5s;}
body.ready #timeline{opacity:1;transform:none;}
.rail{position:absolute;left:0;right:0;top:8px;height:1px;background:rgba(241,236,223,.15);}
.rail-fill{position:absolute;left:0;top:0;width:100%;height:1px;background:linear-gradient(90deg,rgba(226,183,111,.1),var(--accent));transform-origin:0 50%;transform:scaleX(0);opacity:.75;box-shadow:0 0 9px rgba(226,183,111,.2);}
.rail-comet{position:absolute;top:50%;left:0;width:3px;height:3px;margin-left:-1.5px;margin-top:-1.5px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px 2px rgba(226,183,111,.35);opacity:.9;}
.ticks{position:absolute;inset:0;}
.tick{position:absolute;top:0;transform:translateX(-50%);min-width:62px;height:34px;padding:0;display:flex;flex-direction:column;align-items:center;background:none;border:0;color:inherit;pointer-events:auto;-webkit-tap-highlight-color:transparent;}
.tick .dot{display:block;width:3.5px;height:3.5px;margin-top:6.25px;border-radius:50%;background:rgba(241,236,223,.25);transition:width .4s cubic-bezier(.2,.8,.2,1),height .4s cubic-bezier(.2,.8,.2,1),margin-top .4s cubic-bezier(.2,.8,.2,1),background .4s ease,box-shadow .4s ease;}
.tick-year{margin-top:8px;font:400 7.5px/1 var(--mono);letter-spacing:.08em;color:rgba(241,236,223,.43);white-space:nowrap;transition:color .4s ease;}
.tick-name{margin-top:5px;font:400 6.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:rgba(241,236,223,.22);transition:color .4s ease;}
.tick:first-child .tick-year,.tick:first-child .tick-name{transform:translateX(22px);}
.tick:last-child .tick-year,.tick:last-child .tick-name{transform:translateX(-16px);}
.tick:hover .dot{background:rgba(241,236,223,.62);box-shadow:0 0 8px rgba(241,236,223,.2);}
.tick:hover .tick-year,.tick:hover .tick-name{color:rgba(241,236,223,.55);}
.tick.active .dot{width:5px;height:5px;margin-top:5.5px;background:var(--accent);box-shadow:0 0 11px 1px var(--accent);}
.tick.active .tick-year{color:rgba(241,236,223,.85);}
.tick.active .tick-name{color:var(--accent);}
.tick.passed .dot{background:rgba(241,236,223,.38);}
#hint{position:absolute;right:clamp(26px,4.7vw,86px);bottom:clamp(68px,8vh,86px);font:400 7.5px/1 var(--mono);letter-spacing:.16em;color:rgba(241,236,223,.20);text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity 1s ease .8s;}
body.ready #hint{opacity:1;}
#hint span{color:rgba(241,236,223,.38);padding:0 .35em;}

@media (max-width:820px){
  #brand{left:20px;top:18px;gap:10px;}
  .brand-mark{width:31px;height:31px;}.brand-mark svg{width:20px;height:20px;}
  .brand-title{font-size:9px;letter-spacing:.27em;text-indent:.27em;}
  .brand-sub{font-size:6.5px;letter-spacing:.16em;}
  #topright{right:18px;top:16px;gap:10px;}
  #count{font-size:8px;}
  #playpause{width:38px;height:38px;}#playpause svg{width:38px;height:38px;}
  #readout{left:24px;right:24px;top:72px;bottom:auto;width:auto;}
  #mTitle{font-size:clamp(31px,8.8vw,42px);margin-top:10px;}
  #mFormula{font-size:clamp(21px,6.2vw,32px);margin-top:10px;}
  #mCaption{font-size:13px;margin-top:9px;max-width:30ch;line-height:1.3;}
  #mNote{font-size:6.5px;margin-top:7px;}
  #timeline{left:16px;right:16px;bottom:14px;height:28px;}.rail{top:7px;}.tick{min-width:28px;height:26px;}.tick .dot{margin-top:5.25px;}.tick.active .dot{margin-top:4.5px;}.tick-year,.tick-name{display:none;}
  #hint{display:none;}
}
@media (max-height:640px){
  #readout{top:auto;bottom:80px;left:24px;right:auto;width:min(48vw,380px);}
  #mCaption{display:none;}#mFormula{font-size:28px;}#mTitle{font-size:32px;}#mNote{display:none;}
  #hint{display:none;}
}
@media (prefers-reduced-motion:reduce){#grain{animation:none;}}
html.snap *,html.snap *::before,html.snap *::after{transition-duration:0s!important;transition-delay:0s!important;animation-duration:0s!important;animation-delay:0s!important;}

<body>
<div id="bg" aria-hidden="true"></div>
<div id="tint" aria-hidden="true"></div>
<canvas id="stage" aria-hidden="true"></canvas>
<div id="vignette" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>

<div id="ui">
  <header id="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12.2"/><circle cx="16" cy="16" r="6.2" opacity=".55"/><circle class="core" cx="27.8" cy="16" r="2.2"/></svg>
    </div>
    <div class="brand-copy">
      <div class="brand-title">ONE POINT</div>
      <div class="brand-sub">20 MILESTONES · A HISTORY OF MATHEMATICS</div>
    </div>
  </header>

  <div id="topright">
    <span id="count"><b>01</b> / 20</span>
    <button id="playpause" type="button" aria-label="Pause" title="Pause or play">
      <svg viewBox="0 0 44 44" aria-hidden="true"><circle class="progress-bg" cx="22" cy="22" r="19"/><circle id="progressRing" class="progress-ring" cx="22" cy="22" r="19"/></svg>
      <span class="pause-bars" aria-hidden="true"><i></i><i></i></span>
      <span class="play-tri" aria-hidden="true"></span>
    </button>
  </div>

  <aside id="readout" aria-label="Current movement">
    <div class="meta"><span class="idx" id="mIdx">01</span><span>/ 07</span><span class="dot">·</span><span id="mEra">c. 300 BCE</span></div>
    <h1 id="mTitle">The Circle</h1>
    <div id="mFormula"></div>
    <p id="mCaption"></p>
    <div id="mNote"></div>
  </aside>

  <nav id="timeline" aria-label="Curves">
    <div class="rail" aria-hidden="true"><div class="rail-fill" id="railFill"></div><div class="rail-comet" id="railComet"></div></div>
    <div class="ticks" id="ticks"></div>
  </nav>
  <div id="hint" aria-hidden="true">← → <span>/</span> move <span>·</span> space <span>/</span> pause</div>
</div>

<script>
(() => {
'use strict';
window.addEventListener('error',e=>{document.title='ERR: '+e.message;});

const TAU=Math.PI*2;
const clamp=(v,a=0,b=1)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
function smoothstep(a,b,x){const t=clamp((x-a)/(b-a||1e-9));return t*t*(3-2*t);}
function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rgbCache=new Map();
function rgb(hex){let c=rgbCache.get(hex);if(c)return c;let h=hex.replace('#','');if(h.length===3)h=h.split('').map(ch=>ch+ch).join('');c=[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];rgbCache.set(hex,c);return c;}
function rgba(hex,a){const c=rgb(hex);return `rgba(${c[0]},${c[1]},${c[2]},${a})`;}

const uiStyle=document.createElement('style');
uiStyle.textContent='#ticks .tick-year,#ticks .tick-name{display:none!important}.tick{min-width:14px!important}.tick:first-child .tick-year,.tick:first-child .tick-name,.tick:last-child .tick-year,.tick:last-child .tick-name{transform:none!important}#ticks .tick .dot{margin-top:7.5px}';
document.head.appendChild(uiStyle);

const canvas=document.getElementById('stage');
const ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,SCALE=1;
let activeIndex=-1,T=0,paused=false,lastNow=performance.now(),dirty=true;
let TOTAL=0,starts=[];
const CYCLES=2, TARGET_TOTAL=90, PLAY_SPEED=1, FADE=1.15;
let fade=null;
const BG='#05070b';

/* ---------- curves ---------- */
function sample(fn,t0,t1,n=1000){
  const p=[];
  for(let i=0;i<n;i++){
    const t=lerp(t0,t1,i/n),q=fn(t);
    if(Number.isFinite(q[0])&&Number.isFinite(q[1]))p.push([q[0],q[1]]);
  }
  return p;
}
function polarLoop(rf,t0=0,t1=TAU,n=1200){
  return sample(t=>{const r=rf(t);return [r*Math.cos(t),r*Math.sin(t)];},t0,t1,n);
}
function areaLoop(f,a,b,n=420){
  const p=[];
  for(let i=0;i<=n;i++){const x=lerp(a,b,i/n);p.push([x,f(x)]);}
  for(let i=n;i>=0;i--){const x=lerp(a,b,i/n);p.push([x,0]);}
  return p;
}
function curveLoop(fn,uc=1,n=1200){return sample(t=>fn(t),0,TAU*uc,n);}
function circlePoints(cx,cy,r,steps=96){const p=[];for(let i=0;i<=steps;i++){const a=i/steps*TAU;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}return p;}

function regularPolygon(n,r=1){
  const p=[];for(let i=0;i<n;i++){const a=i/n*TAU;p.push([r*Math.cos(a),r*Math.sin(a)]);}return p;
}
function starPolygon(n,step,r=1){
  const p=[];let k=0;for(let i=0;i<n;i++){const a=k/n*TAU;p.push([r*Math.cos(a),r*Math.sin(a)]);k=(k+step)%n;}return p;
}
function foliumLoop(){
  const p=[];const n=1500;
  for(let i=0;i<n;i++){
    const u=(i+.5)/n*Math.PI/2,t=Math.tan(u),d=1+t*t*t;
    p.push([3*t/d,3*t*t/d]);
  }
  return p;
}
function cantorF(x){
  let y=0,f=.5;
  for(let i=0;i<16;i++){
    x*=3;const d=Math.floor(x);
    if(d===1){y+=f;break;}
    if(d===2)y+=f;
    x-=d;f*=.5;
  }
  return Math.min(1,y);
}
function cantorLoop(){
  const p=[];const n=1700;
  for(let i=0;i<=n;i++){const x=i/n;p.push([x,cantorF(x)]);}
  for(let i=n;i>=0;i--){const x=i/n;p.push([x,0]);}
  return p;
}
function kochLoop(){
  let pts=[[1,0],[-.5,Math.sqrt(3)/2],[-.5,-Math.sqrt(3)/2]];
  for(let lev=0;lev<4;lev++){
    const out=[];
    for(let i=0;i<pts.length;i++){
      const a=pts[i],b=pts[(i+1)%pts.length];
      const vx=(b[0]-a[0])/3,vy=(b[1]-a[1])/3;
      const p1=[a[0]+vx,a[1]+vy],p2=[a[0]+2*vx,a[1]+2*vy];
      const ca=Math.cos(-Math.PI/3),sa=Math.sin(-Math.PI/3);
      const peak=[p1[0]+vx*ca-vy*sa,p1[1]+vx*sa+vy*ca];
      out.push(a,p1,peak,p2);
    }
    pts=out;
  }
  return pts;
}
function lorenzLoop(){
  let x=1,y=1,z=1;const pts=[];const dt=.004;
  for(let i=0;i<14000;i++){
    const dx=10*(y-x),dy=x*(28-z)-y,dz=x*y-(8/3)*z;
    x+=dx*dt;y+=dy*dt;z+=dz*dt;
    if(i>1800&&i%5===0)pts.push([x,z]);
    if(pts.length>=380)break;
  }
  const back=pts.slice(0,-1).reverse();
  return pts.concat(back);
}
function mandelbrotLoop(){
  return curveLoop(t=>[.5*Math.cos(t)-.25*Math.cos(2*t),.5*Math.sin(t)-.25*Math.sin(2*t)],1,1400);
}

const LOOPS={
  pythagoras:()=>curveLoop(t=>[Math.cos(t),Math.sin(t)],1),
  euclid:()=>regularPolygon(10,1),
  archimedes:()=>areaLoop(x=>x*x,-1,1,520),
  apollonius:()=>curveLoop(t=>[1.65*Math.cos(t),1.02*Math.sin(t)],1),
  ptolemy:()=>curveLoop(t=>[Math.cos(t)+.32*Math.cos(5*t),Math.sin(t)+.32*Math.sin(5*t)],1,1500),
  aryabhata:()=>areaLoop(x=>Math.sin(x),0,TAU,520),
  kepler:()=>curveLoop(t=>[1.65*Math.cos(t),1.02*Math.sin(t)],1),
  descartes:()=>foliumLoop(),
  galileo:()=>{
    const p=[];for(let i=0;i<=520;i++){const t=i/520*TAU;p.push([t-Math.sin(t),1-Math.cos(t)]);}
    for(let i=520;i>=0;i--){const x=i/520*TAU;p.push([x,0]);}return p;
  },
  newton:()=>areaLoop(x=>.45*x*x*x-.6*x+1,-1.2,1.2,520),
  bernoulli:()=>curveLoop(t=>[Math.cos(t)/(1+Math.sin(t)*Math.sin(t)),Math.sin(t)*Math.cos(t)/(1+Math.sin(t)*Math.sin(t))],1,1400),
  euler:()=>curveLoop(t=>[Math.cos(t),Math.sin(t)],1),
  roots:()=>starPolygon(12,5,1),
  gauss:()=>areaLoop(x=>Math.exp(-x*x),-2.2,2.2,520),
  fourier:()=>curveLoop(t=>{
    let x=0,y=0;
    for(let n=1;n<=9;n+=2){const a=4/(Math.PI*n);x+=a*Math.cos(n*t);y+=a*Math.sin(n*t);}
    return [x,y];
  },1,1700),
  cantor:()=>cantorLoop(),
  koch:()=>kochLoop(),
  lorenz:()=>lorenzLoop(),
  fft:()=>{
    const xs=[-1.65,-.78,.09,.96,1.83],ys=[];for(let i=0;i<8;i++)ys.push(-1.15+i/7*2.3);
    const p=[];const push=(x,y)=>{const q=p[p.length-1];if(!q||Math.hypot(q[0]-x,q[1]-y)>1e-6)p.push([x,y]);};
    let cy=ys[7];push(xs[0],cy);
    for(let c=0;c<5;c++){
      const ty=(c%2===0)?ys[0]:ys[7];const steps=14;
      for(let k=1;k<=steps;k++)push(xs[c],lerp(cy,ty,k/steps));
      cy=ty;
      if(c<4)for(let k=1;k<=8;k++)push(lerp(xs[c],xs[c+1],k/8),cy);
    }
    const rail=ys[7]+.55;
    for(let k=1;k<=12;k++)push(xs[4],lerp(cy,rail,k/12));
    for(let k=1;k<=28;k++)push(lerp(xs[4],xs[0],k/28),rail);
    for(let k=1;k<=12;k++)push(xs[0],lerp(rail,ys[7],k/12));
    return p;
  },
  mandelbrot:()=>mandelbrotLoop()
};

/* ---------- chronological scene list: 20 milestones ---------- */
const SCENES=[

const N_SCENES=SCENES.length;


/* ---------- layout / maths ---------- */
function metrics(){
  const mobile=W<=820;
  return {W,H,mobile,cx:mobile?W*.50:W*.615,cy:mobile?H*.57:H*.47,R:mobile?Math.min(W*.39,H*.19):Math.min(W*.24,H*.29)};
}
const DUST=(()=>{const r=mulberry32(19023),a=[];for(let i=0;i<125;i++)a.push({x:r(),y:r(),z:.2+r()*.8,p:r()*TAU,s:.004+r()*.017});return a;})();
const trail=[];
let lastPoint=null;
let pointer={x:0,y:0,tx:0,ty:0};

function drawBackdrop(){
  const m=metrics(),accent=SCENES[Math.max(0,activeIndex)].accent;
  const g=ctx.createRadialGradient(m.cx,m.cy,0,m.cx,m.cy,Math.max(W,H)*.7);
  g.addColorStop(0,rgba(accent,.055));g.addColorStop(.45,rgba(accent,.015));g.addColorStop(1,rgba(accent,0));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const step=84,ox=(pointer.x*7+W*.5)%step,oy=(pointer.y*5+H*.5)%step;
  ctx.save();ctx.strokeStyle='rgba(241,236,223,.032)';ctx.lineWidth=.6;
  for(let x=ox-step;x<W+step;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=oy-step;y<H+step;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.restore();
  ctx.save();ctx.strokeStyle='rgba(241,236,223,.065)';ctx.lineWidth=.7;
  ctx.beginPath();ctx.moveTo(m.cx-m.R*1.75,m.cy);ctx.lineTo(m.cx+m.R*1.75,m.cy);ctx.moveTo(m.cx,m.cy-m.R*1.25);ctx.lineTo(m.cx,m.cy+m.R*1.25);ctx.stroke();ctx.restore();
  for(const d of DUST){
    const x=(d.x+Math.sin(T*.001+d.p)*.006)*W,y=(d.y+Math.cos(T*.001*.8+d.p)*.007)*H;
    const a=(.035+.085*d.z)*(.5+.5*Math.sin(T*.001*.6+d.p*3));
    ctx.fillStyle=rgba('#e6ded0',a);ctx.beginPath();ctx.arc(x,y,.35+d.z*.85,0,TAU);ctx.fill();
  }
}

/* ---------- drawing helpers ---------- */
function pathPts(pts,close=false){if(!pts.length)return;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);if(close)ctx.closePath();}
function glowLine(pts,color,width=1,alpha=1,glow=8,close=false,dash=null){
  if(!pts||pts.length<2)return;
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.setLineDash(dash||[]);pathPts(pts,close);
  if(glow>0){ctx.strokeStyle=rgba(color,alpha*.07);ctx.lineWidth=width+glow;ctx.stroke();ctx.strokeStyle=rgba(color,alpha*.18);ctx.lineWidth=width+glow*.35;ctx.stroke();}
  ctx.strokeStyle=rgba(color,alpha);ctx.lineWidth=width;ctx.stroke();ctx.restore();
}
function fillPath(pts,color,alpha){if(pts.length<3)return;ctx.save();pathPts(pts,true);ctx.fillStyle=rgba(color,alpha);ctx.fill();ctx.restore();}
function glowDot(x,y,r,color,alpha=1,glow=0){
  if(glow>0){ctx.fillStyle=rgba(color,alpha*.08);ctx.beginPath();ctx.arc(x,y,r+glow,0,TAU);ctx.fill();ctx.fillStyle=rgba(color,alpha*.18);ctx.beginPath();ctx.arc(x,y,r+glow*.36,0,TAU);ctx.fill();}
  ctx.fillStyle=rgba(color,alpha);ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
}
function halo(x,y,r,color,alpha){if(r<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(color,alpha));g.addColorStop(.35,rgba(color,alpha*.35));g.addColorStop(1,rgba(color,0));ctx.save();ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore();}
function mathText(str,x,y,size,color,alpha=1,italic=false,align='left'){ctx.save();ctx.font=`${italic?'italic ':''}${size}px "STIXVar","STIXMath","Cambria Math",serif`;ctx.fillStyle=rgba(color,alpha);ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(str,x,y);ctx.restore();}
function monoText(str,x,y,size,color,alpha=1,align='left'){ctx.save();ctx.font=`400 ${size}px "PlexMono","Consolas",monospace`;ctx.fillStyle=rgba(color,alpha);ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(str,x,y);ctx.restore();}

/* ---------- loop preparation ---------- */
function distance(a,b){return Math.hypot(b[0]-a[0],b[1]-a[1]);}
function resampleClosed(pts,n=1000){
  if(!pts||pts.length<3)return[];
  const cum=[0];let total=0;
  for(let i=1;i<=pts.length;i++){const p=pts[i===pts.length?0:i];total+=distance(pts[i-1],p);cum.push(total);}
  const out=[];let j=0;
  for(let k=0;k<n;k++){
    const d=total*k/n;
    while(j<cum.length-2&&cum[j+1]<=d)j++;
    const seg=cum[j+1]-cum[j]||1,f=clamp((d-cum[j])/seg,0,1);
    const a=pts[j],b=pts[(j+1)%pts.length];
    out.push([lerp(a[0],b[0],f),lerp(a[1],b[1],f)]);
  }
  return out;
}
function findContact(pts){
  const n=pts.length;const M=v=>((v%n)+n)%n;let best=null;
  for(let i=0;i<n;i++){
    const a=pts[M(i-5)],b=pts[M(i+5)];
    const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1;
    if(dx<=0)continue;
    if(Math.abs(dy)>len*.075)continue;
    const a1=pts[M(i-14)],b1=pts[M(i+14)];
    const a2=pts[M(i-28)],b2=pts[M(i+28)];
    const s1=Math.abs((b1[1]-a1[1])/(Math.hypot(b1[0]-a1[0],b1[1]-a1[1])||1));
    const s2=Math.abs((b2[1]-a2[1])/(Math.hypot(b2[0]-a2[0],b2[1]-a2[1])||1));
    const score=Math.abs(dy)/len+s1*.22+s2*.18;
    if(!best||score<best.score)best={i,score};
  }
  if(best)return {i:best.i,rot:0};
  // fallback: choose the smoothest point and rotate the loop so its tangent is horizontal-right
  let fb=null;
  for(let i=0;i<n;i++){
    const a=pts[M(i-10)],b=pts[M(i+10)];
    const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1;
    const score=Math.abs(dx)/len; // prefer smooth vertical-ish for rotation
    if(!fb||score<fb.score)fb={i,score,ang:Math.atan2(dy,dx)};
  }
  const rot=-fb.ang;
  for(const p of pts){const x=p[0],y=p[1];p[0]=x*Math.cos(rot)-y*Math.sin(rot);p[1]=x*Math.sin(rot)+y*Math.cos(rot);}
  return {i:fb.i,rot};
}
function prepare(scene){
  let pts=scene.build();
  if(pts.length>2&&distance(pts[0],pts[pts.length-1])<1e-6)pts.pop();
  const c=findContact(pts),n=pts.length;
  pts=[...pts.slice(c.i),...pts.slice(0,c.i)];
  let loop=resampleClosed(pts,1000);
  // orientation: contact tangent must point right
  const dx=loop[1][0]-loop[loop.length-1][0],dy=loop[1][1]-loop[loop.length-1][1];
  if(dx<0){loop.reverse();loop.unshift(loop.pop());}
  const o=loop[0];
  let mx=1,my=1;
  for(const p of loop){mx=Math.max(mx,Math.abs(p[0]-o[0]));my=Math.max(my,Math.abs(p[1]-o[1]));}
  const m=metrics();
  const availX=m.mobile?Math.min(m.cx-36,W-m.cx-36):Math.min(m.cx-W*.40,W-m.cx-W*.06);const availY=Math.min(m.cy-78,H-m.cy-82);let sc=clamp(Math.min(Math.max(80,availX*.94)/mx,Math.max(80,availY*.94)/my),.16,900);if(scene.sizeFactor)sc*=scene.sizeFactor;
  const G={x:m.cx,y:m.cy};
  let screen=loop.map(p=>[G.x+sc*(p[0]-o[0]),G.y+sc*(p[1]-o[1])]);
  let origin={x:G.x-sc*o[0],y:G.y-sc*o[1]};
  let rot=c.rot;
  const tm=pathTangent(screen,0),corr=-tm.ang;
  if(Math.abs(corr)>1e-7){
    const cc=Math.cos(corr),ss=Math.sin(corr);
    screen=screen.map(p=>{const x=p[0]-G.x,y=p[1]-G.y;return [G.x+x*cc-y*ss,G.y+x*ss+y*cc];});
    const ox=origin.x-G.x,oy=origin.y-G.y;
    origin={x:G.x+ox*cc-oy*ss,y:G.y+ox*ss+oy*cc};
    rot+=corr;
  }
  let per=0;for(let i=1;i<screen.length;i++)per+=distance(screen[i-1],screen[i]);per+=distance(screen[screen.length-1],screen[0]);
  scene.path=screen;scene.perimeter=per;scene.origin=origin;scene.scale=sc;scene.contact=o;scene.rot=rot;
  scene.G=G;
}

/* ---------- scene transform / animation ---------- */
function buildAll(){
  for(const s of SCENES)prepare(s);
  const sum=SCENES.reduce((a,s)=>a+s.perimeter,0)||1;
  const v0=CYCLES*sum/TARGET_TOTAL;
  for(const s of SCENES)s.duration=CYCLES*s.perimeter/v0;
  starts=[];let acc=0;for(const s of SCENES){starts.push(acc);acc+=s.duration;}
  TOTAL=acc;
  buildTimeline();
}
function locate(tt){
  tt=((tt%TOTAL)+TOTAL)%TOTAL;let acc=0;
  for(let i=0;i<SCENES.length;i++){
    const d=SCENES[i].duration;
    if(tt<acc+d||i===SCENES.length-1)return {i,local:clamp(tt-acc,0,d)};
    acc+=d;
  }
  return {i:0,local:0};
}
function sampleLoop(path,u){
  const n=path.length,q=(u%1+1)%1*n,i=Math.floor(q),f=q-i;
  const a=path[i%n],b=path[(i+1)%n];
  return {x:lerp(a[0],b[0],f),y:lerp(a[1],b[1],f),i};
}
function pathTangent(path,u){
  const n=path.length,q=(u%1+1)%1*n,i=Math.floor(q);
  const a=path[(i-3+n)%n],b=path[(i+3)%n];
  return {x:b[0]-a[0],y:b[1]-a[1],ang:Math.atan2(b[1]-a[1],b[0]-a[0])};
}
function mapLocal(scene,p){
  const r=scene.rot,c=Math.cos(r),s=Math.sin(r);
  return {x:scene.origin.x+scene.scale*(p[0]*c-p[1]*s),y:scene.origin.y+scene.scale*(p[0]*s+p[1]*c)};
}

/* ---------- aux ---------- */
function drawAux(scene,phase,P,reveal){
  const ac=scene.accent,kind=scene.kind,O=scene.origin;
  // local axes
  const axisLen=Math.min(W,H)*(scene.mobile?.22:.26);
  const c=Math.cos(scene.rot),s=Math.sin(scene.rot);
  ctx.save();ctx.lineWidth=.7;
  ctx.strokeStyle=rgba('#f1ecdf',.065);
  ctx.beginPath();ctx.moveTo(O.x-c*axisLen,O.y-s*axisLen);ctx.lineTo(O.x+c*axisLen,O.y+s*axisLen);ctx.stroke();
  ctx.beginPath();ctx.moveTo(O.x+s*axisLen,O.y-c*axisLen);ctx.lineTo(O.x-s*axisLen,O.y+c*axisLen);ctx.stroke();
  ctx.strokeStyle=rgba(ac,.16);
  ctx.beginPath();ctx.arc(O.x,O.y,23,0,TAU);ctx.stroke();
  ctx.restore();
  glowDot(O.x,O.y,1.7,ac,.5,4);
  monoText('O',O.x+9,O.y+13,8,ac,.38);
  // radial structure
  if(kind==='polar'||kind==='circle'||kind==='ellipse'||kind==='lissajous'){
    const maxK=Math.min(12,Math.ceil(reveal*12));
    for(let k=0;k<=maxK;k++){
      const q=sampleLoop(scene.path,Math.min(.999,k/12)),a=(k%3===0?.10:.045);
      glowLine([[O.x,O.y],[q.x,q.y]],ac,.55,a,0);
    }
  }
  if(kind==='lissajous'){
    let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
    for(const p of scene.path){minx=Math.min(minx,p[0]);maxx=Math.max(maxx,p[0]);miny=Math.min(miny,p[1]);maxy=Math.max(maxy,p[1]);}
    glowLine([[minx,miny],[maxx,miny],[maxx,maxy],[minx,maxy],[minx,miny]],'#f1ecdf',.5,.07,0,false,[3,7]);
  }
  if(kind==='ellipse'){
    const a=1.65,b=1.02,cc=Math.sqrt(Math.max(0,a*a-b*b));
    for(const sx of [-1,1]){
      const q=mapLocal(scene,[sx*cc,0]);
      glowDot(q.x,q.y,2.2,'#e2b76f',.55,5);
      glowLine([[q.x,q.y],[P.x,P.y]],ac,.5,.1,0,[2,7]);
    }
  }
  if(kind==='parabola'||kind==='catenary'||kind==='sine'||kind==='cycloid'||kind==='gauss'||kind==='cantor'){
    // area hatching / baseline
    const a=mapLocal(scene,[-1.9,0]),b=mapLocal(scene,[1.9,0]);
    glowLine([[a.x,a.y],[b.x,b.y]],'#f1ecdf',.7,.10,0,[4,8]);
    const maxU=Math.min(8,Math.ceil(reveal*8));
    for(let k=0;k<=maxU;k++){
      const u=Math.min(.5,k/8*.5),q=sampleLoop(scene.path,u);
      glowLine([[q.x,q.y],[q.x,scene.G.y]],ac,.45,.05,0);
    }
  }
  if(kind==='fourier'){
    const r=Math.min(W,H)*.075;
    for(let k=0;k<3;k++){
      const rr=r*(1+k*.72);
      ctx.save();ctx.strokeStyle=rgba(k%2?'#7bd7c4':'#8fd4de',.13);ctx.lineWidth=.55;ctx.beginPath();ctx.arc(O.x,O.y,rr,0,TAU);ctx.stroke();ctx.restore();
      const a=phase*TAU*(k+1)*.5+k;
      glowLine([[O.x,O.y],[O.x+Math.cos(a)*rr,O.y+Math.sin(a)*rr]],k%2?'#7bd7c4':'#8fd4de',.6,.18,0);
    }
  }
  if(kind==='fft'){
    // butterfly lattice
    const cols=5,rows=8,l=mapLocal(scene,[-1.65,-1.15]),r=mapLocal(scene,[1.83,1.15]);
    for(let c=0;c<cols;c++){
      const x=lerp(l.x,r.x,c/(cols-1));
      glowLine([[x,l.y],[x,r.y]],'#f1ecdf',.4,.035,0);
      for(let q=0;q<rows;q++)glowDot(x,lerp(l.y,r.y,q/(rows-1)),1,'#f1ecdf',.12,0);
    }
    for(let sN=0;sN<3;sN++){
      const d=1<<sN;
      for(let rr=0;rr<rows;rr++)if((rr%(2*d))<d){
        const a=mapLocal(scene,[lerp(-1.65,1.83,sN/4),lerp(-1.15,1.15,rr/(rows-1))]);
        const b=mapLocal(scene,[lerp(-1.65,1.83,(sN+1)/4),lerp(-1.15,1.15,(rr+d)/(rows-1))]);
        glowLine([[a.x,a.y],[b.x,b.y]],sN===2?'#a8b3ef':(sN===1?'#7cc7d8':'#e2b76f'),.55,.09*phase,0);
      }
    }
    const bars=8;
    for(let k=0;k<bars;k++){
      const x=lerp(l.x,r.x,(k+.5)/bars),h=(0.25+0.75*Math.abs(Math.sin(k*1.7)))*Math.min(W,H)*.055;
      glowLine([[x,r.y],[x,r.y+h]],k%3===0?'#e2b76f':'#7cc7d8',2,.22,4);
    }
  }
  if(kind==='polygon'){
    const O=scene.origin;
    glowLine(circlePoints(O.x,O.y,scene.scale,96),'#f1ecdf',.55,.09,0);
    for(let k=0;k<36;k++){const q=sampleLoop(scene.path,k/36);glowDot(q.x,q.y,1.3,ac,.28,2);}
  }
  if(kind==='mandelbrot'){
    for(const [x,y,r] of [[-1,0,.25],[-.125,.65,.18],[-.125,-.65,.18],[.25,0,.115],[-1.3,.35,.08]]){
      const q=mapLocal(scene,[x,y]);
      ctx.save();ctx.strokeStyle=rgba(ac,.22);ctx.lineWidth=.7;ctx.beginPath();ctx.arc(q.x,q.y,scene.scale*r,0,TAU);ctx.stroke();ctx.restore();
    }
    for(let k=0;k<5;k++){
      const a=k*2.399+.4,q=mapLocal(scene,[Math.cos(a)*.88,Math.sin(a)*.88]);
      glowDot(q.x,q.y,1.2,ac,.25,0);
    }
  }
  if(kind==='lorenz'){
    const O=scene.origin;
    glowLine([[O.x-Math.min(W,H)*.16,O.y],[O.x+Math.min(W,H)*.16,O.y]],'#f1ecdf',.5,.055,0,[3,9]);
    glowLine([[O.x,O.y-Math.min(W,H)*.13],[O.x,O.y+Math.min(W,H)*.13]],'#f1ecdf',.5,.055,0,[3,9]);
  }
  if(scene.id==='pythagoras'){
    const footX=P.x, footY=scene.G.y;
    glowLine([[O.x,O.y],[footX,footY],[P.x,P.y],[O.x,O.y]],'#f1ecdf',.85,.35,4);
    glowLine([[P.x,footY],[P.x,P.y]],'#7cc7d8',.6,.17,0,[3,7]);
    monoText('cos', (O.x+footX)/2, O.y+17, 8, '#dc938b', .38, 'center');
    monoText('sin', P.x+12, (footY+P.y)/2, 8, '#7cc7d8', .35);
  }
  if(scene.id==='euler'){
    glowLine([[P.x,O.y],[P.x,P.y]],'#f1ecdf',.5,.13,0,[2,6]);
    glowLine([[O.x,O.y],[P.x,O.y]],'#7bd7c4',.6,.20,0);
    glowDot(P.x,O.y,1.5,'#7bd7c4',.45,2);
    monoText('cos θ', (O.x+P.x)/2, O.y+15, 8, '#7bd7c4', .34, 'center');
    monoText('i sin θ', P.x+10, (O.y+P.y)/2, 8, ac, .32);
  }
  if(scene.id==='kepler'){
    const a=1.65,b=1.02,cc=Math.sqrt(a*a-b*b);
    for(const sx of [-1,1]){
      const q=mapLocal(scene,[sx*cc,0]);
      if(sx>0){
        halo(q.x,q.y,22,'#e2b76f',.15);
        glowDot(q.x,q.y,3.2,'#e2b76f',.75,7);
        glowLine([[q.x,q.y],[P.x,P.y]],'#e2b76f',.6,.16,0,[3,7]);
      }else glowDot(q.x,q.y,1.5,ac,.24,0);
    }
  }
  if(scene.id==='galileo'){
    const w=mapLocal(scene,[3.1416,1]);
    glowLine(circlePoints(w.x,w.y,scene.scale*.36,64),'#f1ecdf',.7,.13,0);
  }
  // tangent and normal
  const tan=pathTangent(scene.path,phase),len=Math.hypot(tan.x,tan.y)||1;
  const tx=tan.x/len,ty=tan.y/len,nx=-ty,ny=tx;
  glowLine([[P.x-tx*46,P.y-ty*46],[P.x+tx*46,P.y+ty*46]],'#e2b76f',.75,.32,3);
  glowLine([[P.x-nx*30,P.y-ny*30],[P.x+nx*30,P.y+ny*30]],'#f1ecdf',.45,.09,0,[2,6]);
  // radius from O
  glowLine([[O.x,O.y],[P.x,P.y]],ac,.65,.13,0,[2,9]);
}

/* ---------- point / trail ---------- */
function pushTrail(p){trail.push({x:p.x,y:p.y,t:performance.now()});const cutoff=performance.now()-1500;while(trail.length&&trail[0].t<cutoff)trail.shift();if(trail.length>110)trail.shift();}
function drawTrail(accent){
  if(trail.length<2)return;ctx.save();ctx.lineCap='round';
  for(let i=1;i<trail.length;i++){const a=i/trail.length;ctx.strokeStyle=rgba(accent,a*a*.3);ctx.lineWidth=.35+a*2.1;ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke();}
  ctx.restore();
}
function drawPoint(p,accent){
  if(!p)return;
  halo(p.x,p.y,46,accent,.18);
  glowDot(p.x,p.y,4.3,'#fff8e8',.99,18);
  ctx.strokeStyle=rgba(accent,.6);ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,10,0,TAU);ctx.stroke();
  ctx.strokeStyle=rgba(accent,.22);ctx.lineWidth=.7;ctx.setLineDash([2,4]);ctx.beginPath();ctx.arc(p.x,p.y,16,0,TAU);ctx.stroke();ctx.setLineDash([]);
  mathText('P',p.x+17,p.y-16,15,accent,.92,true);
}

/* ---------- scene render ---------- */
function drawSceneLayer(scene,phase,alpha,reveal,showPoint){
  const accent=scene.accent;
  const P=sampleLoop(scene.path,phase);
  ctx.save();ctx.globalAlpha=alpha;
  ctx.strokeStyle=rgba(accent,.17);ctx.lineWidth=.8;ctx.beginPath();ctx.arc(scene.G.x,scene.G.y,14,0,TAU);ctx.stroke();
  drawAux(scene,phase,P,reveal);
  if(reveal>0.002){
    const n=scene.path.length,count=Math.max(2,Math.ceil(reveal*n));
    if(reveal>=.999){
      fillPath([...scene.path,scene.path[0]],accent,.012);
      glowLine([...scene.path,scene.path[0]],accent,1.45,.74,10,false);
    }else{
      glowLine(scene.path.slice(0,count),accent,1.35,.62,8,false);
    }
  }
  ctx.restore();
  return P;
}
function render(){
  const loc=locate(T),scene=SCENES[loc.i];
  if(loc.i!==activeIndex)setMovement(loc.i);
  ctx.clearRect(0,0,W,H);
  drawBackdrop();
  const accent=scene.accent;
  if(fade){
    const e=(performance.now()-fade.start)/1000;
    if(e>=FADE)fade=null;
    else{
      const old=SCENES[fade.index];
      const a=1-e/FADE;
      drawSceneLayer(old,0,a,1,false);
    }
  }
  const raw=loc.local/scene.duration*CYCLES;
  const reveal=clamp(raw),phase=raw%1;
  const P=drawSceneLayer(scene,phase,1,reveal,true);
  if(!paused&&P)pushTrail(P);
  drawTrail(accent);
  drawPoint(P,accent);
  document.documentElement.style.setProperty('--accent',accent);
  const prog=clamp(T/TOTAL,0,1);
  railFill.style.transform='scaleX('+prog.toFixed(5)+')';
  railComet.style.left=(prog*100).toFixed(3)+'%';
  ring.style.strokeDashoffset=String(CIRC*(1-prog));
  lastPoint=P;
}
function cylesPhase(local,scene){return (local/scene.duration*CYCLES)%1;}

/* ---------- readout / timeline ---------- */
const readout=document.getElementById('readout');
const mIdx=document.getElementById('mIdx'),mEra=document.getElementById('mEra'),mTitle=document.getElementById('mTitle'),mFormula=document.getElementById('mFormula'),mCaption=document.getElementById('mCaption'),mNote=document.getElementById('mNote');
const count=document.getElementById('count');
const ticks=document.getElementById('ticks'),railFill=document.getElementById('railFill'),railComet=document.getElementById('railComet');
const playBtn=document.getElementById('playpause'),ring=document.getElementById('progressRing');
const CIRC=2*Math.PI*19;ring.style.strokeDasharray=String(CIRC);
const tickEls=[];
function setMovement(i){
  if(i===activeIndex)return;
  if(activeIndex>=0)fade={index:activeIndex,start:performance.now()};
  activeIndex=i;const s=SCENES[i];
  mIdx.textContent=String(i+1).padStart(2,'0');
  mEra.textContent=s.era;
  mTitle.textContent=s.title;
  mFormula.innerHTML=s.formula;
  mCaption.textContent=s.caption;
  mNote.textContent=s.note;
  count.innerHTML='<b>'+String(i+1).padStart(2,'0')+'</b> / '+String(N_SCENES).padStart(2,'0');
  tickEls.forEach((b,k)=>{b.classList.toggle('active',k===i);b.classList.toggle('passed',k<i);});
  document.documentElement.style.setProperty('--accent',s.accent);
  fitTitle();fitFormula();
  readout.classList.remove('swap');void readout.offsetWidth;readout.classList.add('swap');
}
function fitTitle(){
  if(!mTitle)return;const maxW=Math.max(160,readout.clientWidth);
  let size=W<=820?Math.min(40,readout.clientWidth*.105):Math.min(56,readout.clientWidth*.13);
  mTitle.style.fontSize=size+'px';let g=0;
  while(mTitle.scrollWidth>maxW&&size>18&&g<70){size-=1;g++;mTitle.style.fontSize=size+'px';}
}
function fitFormula(){
  if(!mFormula)return;const maxW=Math.max(160,readout.clientWidth);
  let size=W<=820?Math.min(30,readout.clientWidth*.078):Math.min(43,readout.clientWidth*.10);
  mFormula.style.fontSize=size+'px';let g=0;
  while(mFormula.scrollWidth>maxW&&size>13&&g<80){size-=1.3;g++;mFormula.style.fontSize=size+'px';}
}
function buildTimeline(){
  ticks.innerHTML='';tickEls.length=0;
  SCENES.forEach((s,i)=>{
    const b=document.createElement('button');b.type='button';b.className='tick';
    b.style.left=(starts[i]/TOTAL*100)+'%';b.setAttribute('aria-label',s.title+', '+s.era);b.title=s.title;
    b.innerHTML='<span class="dot" aria-hidden="true"></span>';
    b.addEventListener('click',e=>{e.stopPropagation();jumpTo(i);});
    tickEls.push(b);ticks.appendChild(b);
  });
}
function jumpTo(i){T=starts[i]+.001;trail.length=0;setMovement(i);dirty=true;}
function setPaused(v){
  paused=!!v;
  document.body.classList.toggle('paused',paused);
  playBtn.setAttribute('aria-label',paused?'Play':'Pause');
}
playBtn.addEventListener('click',()=>setPaused(!paused));

/* ---------- frame ---------- */
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-lastNow)/1000));lastNow=now;
  if(!paused){T+=dt*PLAY_SPEED;if(T>=TOTAL)T-=TOTAL;dirty=true;}
  pointer.x=lerp(pointer.x,pointer.tx,.06);pointer.y=lerp(pointer.y,pointer.ty,.06);
  if(dirty||!paused){render();dirty=false;}
  requestAnimationFrame(frame);
}

/* ---------- interaction ---------- */
window.addEventListener('pointermove',e=>{pointer.tx=clamp((e.clientX/W-.5)*2,-1.5,1.5)*.18;pointer.ty=clamp((e.clientY/H-.5)*2,-1.5,1.5)*.13;dirty=true;},{passive:true});
window.addEventListener('pointerleave',()=>{pointer.tx=0;pointer.ty=0;dirty=true;},{passive:true});
window.addEventListener('keydown',e=>{
  if((e.key===' '||e.code==='Space')&&document.activeElement&&document.activeElement.tagName==='BUTTON')return;
  if(e.key==='ArrowRight'){e.preventDefault();jumpTo((activeIndex+1)%N_SCENES);}
  else if(e.key==='ArrowLeft'){e.preventDefault();jumpTo((activeIndex-1+N_SCENES)%N_SCENES);}
  else if(e.key===' '||e.code==='Space'){e.preventDefault();setPaused(!paused);}
  else if(/^[1-9]$/.test(e.key)){jumpTo((Number(e.key)-1)%N_SCENES);}
});
let wheelLock=0;
window.addEventListener('wheel',e=>{const n=performance.now();if(n<wheelLock||Math.abs(e.deltaY)<18)return;wheelLock=n+900;jumpTo((activeIndex+(e.deltaY>0?1:-1)+N_SCENES)%N_SCENES);},{passive:true});
let drag=null;
window.addEventListener('pointerdown',e=>{if(e.target.closest('button,a'))return;drag={x:e.clientX,y:e.clientY,t:performance.now()};},{passive:true});
window.addEventListener('pointerup',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,dt=performance.now()-drag.t;drag=null;
  if(dt<700&&Math.abs(dx)>64&&Math.abs(dx)>Math.abs(dy)*1.4)jumpTo((activeIndex+(dx<0?1:-1)+N_SCENES)%N_SCENES);
},{passive:true});

/* ---------- canvas / boot ---------- */
function sizeCanvas(){
  const maxPixels=3400000,dpr=Math.min(devicePixelRatio||1,2);
  SCALE=Math.min(dpr,Math.sqrt(maxPixels/Math.max(1,W*H)));
  canvas.width=Math.max(1,Math.round(W*SCALE));canvas.height=Math.max(1,Math.round(H*SCALE));
  canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(SCALE,0,0,SCALE,0,0);
}
window.addEventListener('resize',()=>{W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);sizeCanvas();buildAll();activeIndex=-1;setMovement(locate(T).i);fitTitle();fitFormula();dirty=true;});
function boot(){
  W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);sizeCanvas();
  buildAll();
  const params=new URLSearchParams(location.search);
  let startIndex=0;
  if(params.has('m')){
    startIndex=clamp((parseInt(params.get('m'),10)||1)-1,0,N_SCENES-1);
    const local=Math.max(0,Number(params.get('t')||0));
    T=starts[startIndex]+Math.min(local,SCENES[startIndex].duration-.001);
  }
  setPaused(params.get('paused')==='1'||params.get('paused')==='true');
  document.title='One Point — A Mathematical History';
  const brand=document.querySelector('.brand-sub');if(brand)brand.textContent='20 MILESTONES · A HISTORY OF MATHEMATICS';
  const meta=document.querySelector('#readout .meta');
  if(meta&&meta.children.length>=3){
    meta.children[1].textContent='/ '+String(N_SCENES).padStart(2,'0');
    meta.children[2].textContent='·';
  }
  const top=document.getElementById('count');if(top)top.innerHTML='<b>01</b> / '+String(N_SCENES).padStart(2,'0');
  setMovement(startIndex);
  document.body.classList.add('ready');
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{fitTitle();fitFormula();});
  lastNow=performance.now();dirty=true;requestAnimationFrame(frame);
}
boot();
window.__onePoint={
  state:()=>({T,TOTAL,index:locate(T).i,local:locate(T).local,paused,cycle:CYCLES}),
  jump:i=>jumpTo(clamp(i,0,N_SCENES-1)),
  seek:tt=>{T=((Number(tt)%TOTAL)+TOTAL)%TOTAL;dirty=true;},
  pause:()=>setPaused(true),play:()=>setPaused(false),
  scenes:()=>SCENES.map(s=>({id:s.id,perimeter:s.perimeter,duration:s.duration,origin:s.origin,scale:s.scale})),
  contactState:(i)=>{const s=SCENES[i];return {point:s.path[0],tangent:pathTangent(s.path,0),speed:CYCLES*s.perimeter/s.duration};}
};
})();

</script>
